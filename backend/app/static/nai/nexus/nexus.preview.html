<!DOCTYPE html>
<html lang="en" data-kai="idle" data-q="high">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060d"><title>KAI · Command Nexus</title>
<style>/* ============================================================================
   KAI NEXUS — Design System (Increment 1)
   Tokens: color · type · space · glass · depth · motion · state
   One source of truth. Every module consumes these vars — no hard-coded colors.
   The --accent-* group is STATE-DRIVEN: js/state.js flips it on the <html data-kai>
   attribute so the whole interface (not just the avatar) reflects KAI's state.
   ========================================================================== */

:root {
  /* — Base surfaces: near-black with a cold blue undertone ("expensive, not busy") */
  --bg-void:      #04060d;   /* deepest background */
  --bg-abyss:     #070a14;
  --bg-panel:     #0b1020;
  --bg-raised:    #111830;
  --bg-hover:     #17203c;
  --stroke:       #1c2745;   /* hairline borders */
  --stroke-soft:  #141c33;

  /* — Glass (panels float above the ambient field) */
  --glass-bg:     rgba(12, 18, 36, 0.62);
  --glass-stroke: rgba(120, 160, 255, 0.10);
  --glass-blur:   14px;
  --glass-hi:     rgba(150, 190, 255, 0.06);  /* top inner highlight */

  /* — Ink */
  --ink:          #eaf1ff;
  --ink-dim:      #9fb0d4;
  --ink-mute:     #5f6f96;
  --ink-faint:    #38445f;

  /* — KAI signature: celestial blue → cyan */
  --kai-500:  #3f8cff;
  --kai-400:  #5aa0ff;
  --kai-300:  #86bcff;
  --cyan-400: #46e6ff;
  --cyan-300: #8af3ff;
  --halo:     #4aa3ff;

  /* — State palette (each KAI state maps here) */
  --st-idle:      #3f8cff;
  --st-listen:    #46e6ff;
  --st-think:     #7a6bff;
  --st-speak:     #58c8ff;
  --st-exec:      #35d0a8;
  --st-research:  #4ab6ff;
  --st-warning:   #ffb020;
  --st-critical:  #ff4d4d;
  --st-success:   #3ff0b0;

  /* — Semantic status */
  --ok:    #35d0a8;
  --warn:  #ffb020;
  --crit:  #ff4d4d;
  --info:  #4aa3ff;

  /* — STATE-DRIVEN accent (default = idle). state.js overrides via [data-kai] below. */
  --accent:       var(--st-idle);
  --accent-soft:  rgba(63, 140, 255, 0.16);
  --accent-glow:  rgba(63, 140, 255, 0.45);
  --accent-ink:   #bcd6ff;

  /* — Typography */
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-micro: 10.5px;
  --fs-tiny:  11.5px;
  --fs-sm:    13px;
  --fs-base:  14.5px;
  --fs-lg:    17px;
  --fs-xl:    22px;
  --fs-2xl:   30px;
  --fs-display: 44px;
  --tracking-wide: 0.14em;   /* label caps */
  --tracking-mega: 0.42em;   /* the "K A I" title */

  /* — Space scale (4pt) */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;

  /* — Radius */
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;

  /* — Depth (elevation + blue glow) */
  --shadow-1: 0 1px 2px rgba(0,0,0,.5);
  --shadow-2: 0 8px 24px rgba(0,0,0,.45);
  --shadow-3: 0 24px 60px rgba(0,0,0,.55);
  --glow-accent: 0 0 0 1px var(--accent-soft), 0 0 34px -6px var(--accent-glow);

  /* — Motion (calibrated: slow = premium) */
  --ease:       cubic-bezier(.22,.61,.36,1);
  --ease-out:   cubic-bezier(.16,1,.3,1);
  --ease-inout: cubic-bezier(.65,0,.35,1);
  --t-fast: 140ms;
  --t-med:  280ms;
  --t-slow: 560ms;
  --t-cine: 900ms;   /* cinematic panel transitions */

  --z-bg: 0; --z-content: 10; --z-dock: 40; --z-overlay: 80; --z-toast: 100;
}

/* — State-driven theming. state.js sets <html data-kai="thinking"> etc. — */
[data-kai="idle"]      { --accent: var(--st-idle);     --accent-glow: rgba(63,140,255,.45);  --accent-soft: rgba(63,140,255,.16);  --accent-ink:#bcd6ff; }
[data-kai="listening"] { --accent: var(--st-listen);   --accent-glow: rgba(70,230,255,.5);   --accent-soft: rgba(70,230,255,.18);  --accent-ink:#c6f6ff; }
[data-kai="thinking"]  { --accent: var(--st-think);    --accent-glow: rgba(122,107,255,.5);  --accent-soft: rgba(122,107,255,.18); --accent-ink:#d3ccff; }
[data-kai="speaking"]  { --accent: var(--st-speak);    --accent-glow: rgba(88,200,255,.5);   --accent-soft: rgba(88,200,255,.18);  --accent-ink:#c8ecff; }
[data-kai="executing"] { --accent: var(--st-exec);     --accent-glow: rgba(53,208,168,.5);   --accent-soft: rgba(53,208,168,.18);  --accent-ink:#b6f2e2; }
[data-kai="researching"]{--accent: var(--st-research); --accent-glow: rgba(74,182,255,.5);   --accent-soft: rgba(74,182,255,.18);  --accent-ink:#c2e6ff; }
[data-kai="warning"]   { --accent: var(--st-warning);  --accent-glow: rgba(255,176,32,.5);   --accent-soft: rgba(255,176,32,.18);  --accent-ink:#ffe0a6; }
[data-kai="critical"]  { --accent: var(--st-critical); --accent-glow: rgba(255,77,77,.55);   --accent-soft: rgba(255,77,77,.20);   --accent-ink:#ffc4c4; }
[data-kai="success"]   { --accent: var(--st-success);  --accent-glow: rgba(63,240,176,.55);  --accent-soft: rgba(63,240,176,.20);  --accent-ink:#c2ffe8; }

/* Reduced-motion + adaptive-quality flags (set on <html>) collapse durations. */
@media (prefers-reduced-motion: reduce) {
  :root { --t-fast:0ms; --t-med:0ms; --t-slow:0ms; --t-cine:0ms; }
}
[data-motion="off"] { --t-fast:0ms; --t-med:0ms; --t-slow:0ms; --t-cine:0ms; }

/* ============================================================================
   KAI NEXUS — Shell + components (Increment 2)
   Command Nexus layout, glass panels, command dock, tab bar, transforming
   workspace, and the shared component vocabulary the panels reuse.
   ========================================================================== */

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-base);
  color: var(--ink);
  background: var(--bg-void);
  overflow: hidden;              /* the app owns the viewport; panels scroll internally */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--accent-soft); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
h1,h2,h3,p { margin: 0; }

/* ambient canvas layers sit behind everything */
#bg-particles, #bg-grid {
  position: fixed; inset: 0; z-index: var(--z-bg); pointer-events: none;
}

/* ---- App grid --------------------------------------------------------- */
.nexus {
  position: relative; z-index: var(--z-content);
  height: 100dvh; width: 100vw;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  grid-template-areas: "top" "main" "dock" "tabs";
}

/* ---- Top bar ---------------------------------------------------------- */
.topbar {
  grid-area: top;
  display: flex; align-items: center; gap: var(--s4);
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--stroke-soft);
  background: linear-gradient(180deg, rgba(9,13,26,.9), rgba(9,13,26,.4));
  backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: var(--s2); font-weight: 700; letter-spacing: .04em; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 12px var(--accent); animation: pulse 2.6s var(--ease-inout) infinite; }
.brand small { color: var(--ink-mute); font-weight: 500; letter-spacing: var(--tracking-wide); font-size: var(--fs-micro); text-transform: uppercase; }
.topbar .title { flex: 1; text-align: center; letter-spacing: var(--tracking-wide);
  font-size: var(--fs-tiny); color: var(--ink-dim); text-transform: uppercase; }
.topbar .clock { font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.secure { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-tiny);
  letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--accent-ink); }
.secure .ring { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

/* ---- Main: 3 columns around KAI --------------------------------------- */
.main {
  grid-area: main;
  display: grid;
  grid-template-columns: 288px 1fr 322px;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
  min-height: 0;
}
.col { display: flex; flex-direction: column; gap: var(--s4); min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--stroke) transparent; }
.col::-webkit-scrollbar { width: 6px; } .col::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 3px; }

/* ---- Glass panel ------------------------------------------------------ */
.panel {
  position: relative;
  background: var(--glass-bg);
  border: 1px solid var(--glass-stroke);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-2);
  backdrop-filter: blur(var(--glass-blur));
  padding: var(--s4);
  transition: border-color var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease), transform var(--t-med) var(--ease);
}
.panel::before { /* top inner highlight */
  content:""; position:absolute; inset:0; border-radius: inherit; pointer-events:none;
  background: linear-gradient(180deg, var(--glass-hi), transparent 30%);
}
.panel.live { border-color: var(--accent-soft); box-shadow: var(--shadow-2), var(--glow-accent); }
.panel-h { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); }
.panel-h .lbl { font-size: var(--fs-micro); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--ink-mute); }
.panel-h .spark { margin-left: auto; font-family: var(--mono); font-size: var(--fs-tiny); color: var(--accent-ink); }

/* ---- Avatar stage (center) -------------------------------------------- */
.stage {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 0; padding: var(--s2) var(--s4);
}
/* KAI hero — dominates the center; portrait + halo(behind) + fx(front) */
.kai { position: relative; width: min(520px, 92%); aspect-ratio: 3 / 4; max-height: 72vh; margin: 0 auto; }
.kai > canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#kai-halo { z-index: 0; } #kai-fx { z-index: 2; }
#kai-portrait {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
  will-change: transform; filter: saturate(1.06) contrast(1.03);
  -webkit-mask-image: radial-gradient(132% 100% at 50% 36%, #000 56%, transparent 84%), linear-gradient(to bottom, #000 58%, transparent 97%);
  -webkit-mask-composite: source-in;
  mask-image: radial-gradient(132% 100% at 50% 36%, #000 56%, transparent 84%), linear-gradient(to bottom, #000 58%, transparent 97%);
  mask-composite: intersect;
}
.stage .greet { margin-top: var(--s4); font-size: var(--fs-lg); color: var(--ink-dim); text-align:center; min-height: 1.4em;
  transition: color var(--t-med); }
.stage .statechip {
  margin-top: var(--s2); display: inline-flex; align-items: center; gap: var(--s2);
  padding: 5px 14px; border-radius: var(--r-pill); font-size: var(--fs-micro);
  letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--accent-ink);
  background: var(--accent-soft); border: 1px solid var(--accent-soft);
}
.stage .statechip b { width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent); }

/* ---- Command dock ----------------------------------------------------- */
.dock {
  grid-area: dock; display: flex; align-items: center; gap: var(--s3);
  margin: 0 var(--s5) var(--s3); padding: var(--s3) var(--s4); min-height: 56px;
  background: var(--glass-bg); border: 1px solid var(--accent-soft);
  border-radius: var(--r-pill); -webkit-backdrop-filter: blur(var(--glass-blur)); backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--shadow-2), 0 0 34px -14px var(--accent-glow);
  transition: border-color var(--t-med), box-shadow var(--t-med);
}
.dock input { font-size: var(--fs-lg); }
.dock.hot { border-color: var(--accent-soft); box-shadow: var(--shadow-2), var(--glow-accent); }
.dock .mode { display:flex; align-items:center; gap: var(--s2); padding-left: var(--s2); color: var(--accent-ink);
  font-size: var(--fs-micro); letter-spacing: var(--tracking-wide); text-transform: uppercase; white-space: nowrap; }
.dock .mode b { width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent); }
.dock input { flex:1; background:none; border:none; color:var(--ink); font-size: var(--fs-base); padding: var(--s2); }
.dock input::placeholder { color: var(--ink-mute); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display:grid; place-items:center;
  background: var(--bg-raised); border:1px solid var(--stroke); color: var(--ink-dim);
  transition: all var(--t-fast) var(--ease); }
.iconbtn:hover { color: var(--ink); border-color: var(--accent); box-shadow: 0 0 16px -4px var(--accent-glow); transform: translateY(-1px); }
.iconbtn.send { background: var(--accent); color: #04060d; border-color: transparent; }
.iconbtn.mic.on { color: var(--accent); border-color: var(--accent); animation: pulse 1.2s infinite; }

/* ---- Tab bar ---------------------------------------------------------- */
.tabs { grid-area: tabs; display:flex; gap:2px; padding: 0 var(--s5) var(--s3); }
.tab { flex:1; padding: var(--s3) var(--s2); text-align:center; color: var(--ink-mute);
  font-size: var(--fs-micro); letter-spacing: var(--tracking-wide); text-transform: uppercase;
  border-top: 2px solid transparent; border-radius: 0 0 var(--r-sm) var(--r-sm);
  transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast); }
.tab:hover { color: var(--ink-dim); background: var(--bg-panel); }
.tab.active { color: var(--accent-ink); border-top-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), transparent); }

/* ---- Transforming workspace (revealed by a tab) ----------------------- */
.workspace {
  position: fixed; inset: 0; z-index: var(--z-overlay);
  display: grid; place-items: center; padding: var(--s6);
  background: radial-gradient(120% 90% at 50% 40%, rgba(4,6,13,.72), rgba(4,6,13,.94));
  backdrop-filter: blur(6px);
  opacity: 0; visibility: hidden; transition: opacity var(--t-cine) var(--ease-out), visibility var(--t-cine);
}
.workspace.open { opacity: 1; visibility: visible; }
.workspace .frame {
  width: min(1080px, 94vw); max-height: 86dvh; overflow: auto;
  background: var(--glass-bg); border:1px solid var(--glass-stroke); border-radius: var(--r-xl);
  box-shadow: var(--shadow-3), var(--glow-accent); backdrop-filter: blur(20px); padding: var(--s6);
  transform: scale(.94) translateY(18px); opacity:0; transition: transform var(--t-cine) var(--ease-out), opacity var(--t-cine);
}
.workspace.open .frame { transform: none; opacity: 1; }
.ws-head { display:flex; align-items:center; gap:var(--s3); margin-bottom: var(--s5); }
.ws-head h2 { font-size: var(--fs-xl); font-weight:700; letter-spacing:.02em; }
.ws-head .close { margin-left:auto; }

/* ---- Shared component vocabulary -------------------------------------- */
.row { display:flex; align-items:center; gap:var(--s2); padding: 7px 0; border-bottom: 1px solid var(--stroke-soft); font-size: var(--fs-sm); }
.row:last-child { border-bottom: none; }
.row .k { color: var(--ink-dim); } .row .v { margin-left:auto; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-mute); } .mono { font-family: var(--mono); }
.ok{color:var(--ok);} .warn{color:var(--warn);} .crit{color:var(--crit);} .acc{color:var(--accent-ink);}

.meter { height: 7px; border-radius: var(--r-pill); background: var(--bg-abyss); overflow: hidden; border:1px solid var(--stroke-soft); }
.meter > i { display:block; height:100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--cyan-300)); box-shadow: 0 0 12px -2px var(--accent-glow);
  transition: width var(--t-slow) var(--ease-out); }
.meter.warn > i { background: linear-gradient(90deg, var(--warn), #ffd27a); }
.meter.crit > i { background: linear-gradient(90deg, var(--crit), #ff9a9a); }

.chip { display:inline-flex; align-items:center; gap:6px; padding: 3px 9px; border-radius: var(--r-pill);
  font-size: var(--fs-micro); letter-spacing: .06em; text-transform: uppercase;
  background: var(--bg-raised); border:1px solid var(--stroke); color: var(--ink-dim); }
.chip.on { color: var(--accent-ink); border-color: var(--accent-soft); background: var(--accent-soft); }
.chip .d { width:6px; height:6px; border-radius:50%; background: currentColor; }

.big { font-size: var(--fs-2xl); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi { display:flex; flex-direction:column; gap: 2px; }
.kpi .lbl { font-size: var(--fs-micro); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--ink-mute); }

/* activity feed */
.feed .item { display:flex; gap:var(--s3); padding: 8px 0; border-bottom:1px solid var(--stroke-soft);
  font-size: var(--fs-sm); animation: slidein var(--t-slow) var(--ease-out); }
.feed .item time { font-family: var(--mono); color: var(--ink-mute); font-size: var(--fs-tiny); min-width: 62px; }
.feed .item .dotc { width:6px; height:6px; border-radius:50%; margin-top:6px; background: var(--accent); box-shadow:0 0 8px var(--accent-glow); flex:none; }

/* thinking steps */
.steps .step { display:flex; align-items:center; gap:var(--s3); padding:7px 0; font-size: var(--fs-sm); color: var(--ink-dim); }
.steps .step .b { width:14px; height:14px; border-radius:50%; border:2px solid var(--stroke); flex:none; transition: all var(--t-med); }
.steps .step.done .b { background: var(--accent); border-color: var(--accent); box-shadow:0 0 10px var(--accent-glow); }
.steps .step.active .b { border-color: var(--accent); animation: pulse 1s infinite; }
.steps .step.done { color: var(--ink); }

/* toast */
.toasts { position: fixed; right: var(--s5); bottom: 96px; z-index: var(--z-toast); display:flex; flex-direction:column; gap:var(--s2); }
.toast { padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--glass-bg); backdrop-filter: blur(12px);
  border:1px solid var(--accent-soft); box-shadow: var(--shadow-2), var(--glow-accent); font-size: var(--fs-sm);
  animation: slidein var(--t-med) var(--ease-out); max-width: 320px; }

/* settings pill (motion/sound/quality) — inline in the top bar */
.settings { display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; }

/* data-honesty badges (§36) — small mono pill on any simulated/stale value */
.fresh { display:inline-flex; align-items:center; padding:1px 6px; border-radius:var(--r-pill);
  font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; border:1px solid transparent; }
.fresh-live        { color:var(--ok);   border-color:rgba(78,214,167,.35);  background:rgba(78,214,167,.10); }
.fresh-cached      { color:var(--info); border-color:rgba(74,163,255,.32);  background:rgba(74,163,255,.10); }
.fresh-stale       { color:var(--warn); border-color:rgba(242,184,75,.34);  background:rgba(242,184,75,.10); }
.fresh-demo        { color:var(--warn); border-color:rgba(242,184,75,.3);   background:rgba(242,184,75,.08); }
.fresh-unavailable { color:var(--crit); border-color:rgba(240,93,114,.34);  background:rgba(240,93,114,.10); }

/* global "Demo Data" header flag — the whole board is simulated until real feeds land */
.demoflag { font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:var(--tracking-wide);
  text-transform:uppercase; color:var(--warn); border:1px solid rgba(242,184,75,.35);
  background:rgba(242,184,75,.08); padding:3px 9px; border-radius:var(--r-pill); white-space:nowrap; }
.demoflag[hidden] { display:none; }
.seg { display:flex; background: var(--glass-bg); border:1px solid var(--glass-stroke); border-radius: var(--r-pill); overflow:hidden; backdrop-filter: blur(10px); }
.seg button { padding: 5px 11px; font-size: var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; color: var(--ink-mute); }
.seg button.on { color: var(--accent-ink); background: var(--accent-soft); }

/* ---- Animations ------------------------------------------------------- */
@keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
@keyframes slidein { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
@keyframes floaty { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-4px); } }

/* ---- Responsive: tablet ---------------------------------------------- */
@media (max-width: 1080px) {
  .main { grid-template-columns: 1fr 1.3fr; }
  .col.right { display: none; }             /* fold right rail into tabs on tablet */
}

/* ---- Responsive: mobile command interface (Increment 25) ------------- */
@media (max-width: 720px) {
  .main { grid-template-columns: 1fr; padding: var(--s3); }
  .col.left { display: none; }
  .stage canvas { width: 62%; }
  .topbar .title { display:none; }
  .tabs { overflow-x: auto; scrollbar-width:none; }
  .tab { flex: 0 0 auto; min-width: 96px; }
