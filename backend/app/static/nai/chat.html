<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KAI</title>
  <link rel="stylesheet" href="style.css?v=20260604a" />
  <link rel="manifest" href="/kai-ui/manifest.json" />
  <link rel="apple-touch-icon" href="/kai-ui/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/kai-ui/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/kai-ui/icon-512.png" />
  <meta name="theme-color" content="#4f8cff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KAI" />
</head>
<body>
  <header>
    <h1>KAI</h1>
    <div class="controls">
      <label><input type="checkbox" id="use-tools" /> Use tools (no streaming)</label>
      <label><input type="checkbox" id="prefer-local" /> Prefer local (Ollama)</label>
      <button id="new-conv" type="button">New conversation</button>
      <span id="plan-badge" class="plan-badge" hidden></span>
      <a class="nav-link" id="pricing-link" href="/kai-ui/pricing.html">Pricing</a>
      <button class="btn-ghost" id="logout-btn" type="button">Log out</button>
    </div>
  </header>

  <main id="messages" aria-live="polite"></main>

  <form id="composer">
    <textarea id="input" rows="2" placeholder="Type a message…" required></textarea>
    <button type="submit" id="send">Send</button>
  </form>

  <div id="status"></div>

  <script src="auth.js?v=20260604a"></script>
  <script src="chat.js?v=20260604a"></script>
</body>
</html>
