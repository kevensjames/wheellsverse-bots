<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KAI</title>
  <link rel="stylesheet" href="style.css?v=20260604a" />
</head>
<body>
  <header>
    <h1>KAI</h1>
    <div class="controls">
      <label><input type="checkbox" id="use-tools" /> Use tools (no streaming)</label>
      <label><input type="checkbox" id="prefer-local" /> Prefer local (Ollama)</label>
      <button id="new-conv" type="button">New conversation</button>
      <span id="plan-badge" class="plan-badge" hidden></span>
      <a class="nav-link" id="pricing-link" href="/kai-ui/pricing.html">Pricing</a>
      <button class="btn-ghost" id="logout-btn" type="button">Log out</button>
    </div>
  </header>

  <main id="messages" aria-live="polite"></main>

  <form id="composer">
    <textarea id="input" rows="2" placeholder="Type a message…" required></textarea>
    <button type="submit" id="send">Send</button>
  </form>

  <div id="status"></div>

  <script src="auth.js?v=20260604a"></script>
  <script src="chat.js?v=20260604a"></script>
</body>
</html>
