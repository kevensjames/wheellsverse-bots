<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — KAI</title>
  <link rel="stylesheet" href="style.css?v=ts-1780893808" />
  <link rel="manifest" href="/kai-ui/manifest.json" />
  <link rel="apple-touch-icon" href="/kai-ui/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/kai-ui/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/kai-ui/icon-512.png" />
  <meta name="theme-color" content="#4f8cff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KAI" />
</head>
<body>
  <header>
    <h1>KAI</h1>
    <nav class="subnav">
      <a href="/kai-ui/pricing.html">Pricing</a>
      <a href="/kai-ui/signup.html">Sign up</a>
    </nav>
  </header>

  <main>
    <form class="auth-card" id="login-form" novalidate>
      <h1>Welcome back</h1>
      <p class="muted">Log in to continue your conversation.</p>

      <div class="error-banner" id="error"></div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>

      <button class="btn-primary" id="submit" type="submit">Log in</button>

      <p class="alt-link">No account yet? <a href="/kai-ui/signup.html">Sign up</a></p>
    </form>
  </main>

  <script src="auth.js"></script>
  <script src="login-init.js"></script>
</body>
</html>
