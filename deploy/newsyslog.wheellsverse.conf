# NAI log rotation (newsyslog).
#
# Install:
#   sudo cp deploy/newsyslog.wheellsverse.conf /etc/newsyslog.d/wheellsverse.conf
#   sudo newsyslog -nv         # dry-run, confirms config parses
#   sudo newsyslog -v          # force a rotation pass (for testing)
#
# Format: logfile  [owner:group]  mode  count  size  when  flags
#   count = number of rotated files to keep (5)
#   size  = KB threshold to trigger rotation (10240 KB = 10 MB)
#   when  = '*' means time-based rotation disabled (size-only)
#   flags = G (gzip rotated files) N (no signal — uvicorn just keeps writing)
/Users/jhonwheeler/Library/Logs/wheellsverse/nai.stdout.log       jhonwheeler:staff  644  5  10240  *  GN
/Users/jhonwheeler/Library/Logs/wheellsverse/nai.stderr.log       jhonwheeler:staff  644  5  10240  *  GN
/Users/jhonwheeler/Library/Logs/wheellsverse/ollama.stdout.log    jhonwheeler:staff  644  5  10240  *  GN
/Users/jhonwheeler/Library/Logs/wheellsverse/ollama.stderr.log    jhonwheeler:staff  644  5  10240  *  GN
/Users/jhonwheeler/Library/Logs/wheellsverse/health.log           jhonwheeler:staff  644  3   2048  *  GN
