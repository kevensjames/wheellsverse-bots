name: Phase 0 Deploy Gate

# Phase 0 of the platform-maturity roadmap: mandatory pre-merge checks so no
# change reaches a deployable branch (main / istanbul) unless it passes.
# Starts small and honest — it blocks the things that actually caused the
# 2026-07-12 audit findings (missing tests, newly committed secrets), and
# reports (not blocks) on pre-existing debt so it isn't red on day one.
#
# To make these BLOCK a merge (not just report), enable branch protection on
# main + istanbul and require the "gate" check (see PR description).
#
# Security note (matches brain-feedback-ingest.yml): values from github.event.*
# are passed through `env:` and never interpolated inline in `run:` blocks, so
# attacker-controlled fields can't escape into shell parsing.
#
# Only triggers on pull_request (not workflow_dispatch): the secret scan is
# scoped to the PR's commit range, which only exists in PR context — a manual
# run would fall back to a full-history scan and go red on pre-existing secrets.

on:
  pull_request:
    branches: [main, istanbul]

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: security tests (BLOCKING) ────────────────────────────────────
  # Runs the dependency-light security suites. They are guarded by existence so
  # this job is a green no-op on refs that don't carry them yet, and becomes
  # enforced automatically once PRs #31 / #34 / #35 land the files on istanbul.
  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      - name: Run security suites (present-guarded)
        # POST-MERGE FOLLOW-UP: once PRs #31/#34/#35 land these files on istanbul,
        # drop this guard (or assert the files exist) so a later refactor that
        # renames/moves a suite fails loudly instead of silently passing with zero
        # security tests.
        run: |
          set -euo pipefail
          targets=""
          for f in \
            tests/test_nexora_payment_security.py \
            tests/test_money_center_security.py \
            tests/test_api_auth.py ; do
            [ -f "$f" ] && targets="$targets $f"
          done
          if [ -z "$targets" ]; then
            echo "No security suites present on this ref yet (they arrive with the security PRs). Nothing to run."
            exit 0
          fi
          echo "Running:$targets"
          python -m pytest $targets -v

  # ── Gate 2: secret scan (BLOCKING on NEW secrets) ────────────────────────
  # gitleaks scans only the commits introduced by this PR, so it blocks newly
  # committed credentials without going red on pre-existing history.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # let gitleaks annotate the leak location on the PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can diff the PR range
      - name: gitleaks
        # SHA-pinned to the v2 tag commit so a repointed tag can't swap the action
        # under us (supply-chain hardening for a security gate). No GITLEAKS_LICENSE
        # is required for a personal (non-org) repo.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 3: dependency vulnerabilities (REPORT-ONLY for now) ─────────────
  # pip-audit against the curated server requirements. Non-blocking via the
  # job-level continue-on-error until the dependency set is cleaned up
  # (requirements.txt is currently unsatisfiable). The audit step itself exits
  # non-zero on a finding, so to make this a HARD gate later: set
  # continue-on-error: false AND add `dependency-scan` to the gate's `needs`.
  dependency-scan:
    name: Dependency scan (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit server requirements
        run: |
          set -euo pipefail
          req="requirements-server.txt"
          if [ ! -f "$req" ]; then
            echo "$req not found — skipping."
            exit 0
          fi
          # -r audits the pinned set without installing the (unsatisfiable) full
          # stack. Exits non-zero on a vuln; job-level continue-on-error keeps that
          # from blocking the gate (this job is intentionally not in gate.needs).
          pip-audit -r "$req"

  # ── Aggregate gate: the single required check for branch protection ──────
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security-tests, secret-scan]
    if: always()
    steps:
      - name: Verify blocking gates passed
        env:
          TESTS_RESULT: ${{ needs.security-tests.result }}
          SECRETS_RESULT: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          echo "security-tests: $TESTS_RESULT"
          echo "secret-scan:    $SECRETS_RESULT"
          if [ "$TESTS_RESULT" != "success" ] || [ "$SECRETS_RESULT" != "success" ]; then
            echo "::error::Phase 0 gate failed — a blocking check did not pass."
            exit 1
          fi
          echo "Phase 0 gate passed."
