<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NarAI — Voice Presence</title>
<style>
  body { margin: 0; background: #0a0a0a; display: grid; place-items: center; height: 100vh; font-family: system-ui, sans-serif; }
  .avatar {
    width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #4a4aff, #0a0a40);
    display: grid; place-items: center; color: white;
    font-size: 64px; font-weight: 700; letter-spacing: -2px;
    transition: transform 0.3s, box-shadow 0.3s, background 0.6s;
    box-shadow: 0 0 40px rgba(74, 74, 255, 0.3);
    user-select: none;
  }
  .avatar.speaking { animation: pulse 0.6s ease-in-out infinite; box-shadow: 0 0 60px rgba(74, 255, 180, 0.6); }
  .avatar.listening { box-shadow: 0 0 50px rgba(255, 200, 74, 0.5); }
  .avatar.companion { background: radial-gradient(circle at 30% 30%, #ff6b9d, #4a0a2a); }
  .avatar.overwhelm { animation: breathe 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.04); opacity: 1; } }
  .label { position: absolute; bottom: 40px; color: #888; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .reply { position: absolute; bottom: 80px; color: #ccc; font-size: 15px; max-width: 600px; text-align: center; padding: 0 20px; line-height: 1.5; }
</style>
</head>
<body>
<div class="avatar" id="narai">N</div>
<div class="reply" id="reply"></div>
<div class="label" id="status">idle</div>
<button id="mic-btn" style="position:absolute;bottom:120px;background:#4a4aff;border:none;color:white;padding:10px 18px;border-radius:20px;font-size:13px;cursor:pointer">🎙 Hold to talk</button>

<script>
const avatar = document.getElementById('narai');
const status = document.getElementById('status');
const reply = document.getElementById('reply');

// JWT is stored by the main dashboard on v2 login. Fallback: prompt if opened
// standalone so this page is independently usable for debugging.
let token = localStorage.getItem('narai_v2_token');
if (!token) {
  const pw = prompt('NarAI v2 password (to open voice session):');
  if (pw) {
    // Synchronous xhr — we need token before opening WS
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/v2/narai/auth/login', false);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.send(JSON.stringify({password: pw}));
    if (xhr.status === 200) {
      token = JSON.parse(xhr.responseText).token;
      localStorage.setItem('narai_v2_token', token);
    }
  }
}

const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
const wsUrl = proto + location.host + '/api/v2/narai/voice/ws?token=' + encodeURIComponent(token || '');
const ws = new WebSocket(wsUrl);

function setState(state) {
  avatar.className = 'avatar ' + state;
  status.textContent = state;
}

ws.onopen = () => setState('listening');
ws.onclose = () => setState('idle');

ws.onmessage = (e) => {
  if (typeof e.data === 'string') {
    let msg;
    try { msg = JSON.parse(e.data); } catch (_) { return; }
    if (msg.type === 'transcript') {
      const cls = msg.mode === 'companion' ? 'speaking companion' : 'speaking';
      setState(cls);
      reply.textContent = msg.reply || '';
    } else if (msg.type === 'audio_end') {
      setState('listening');
    }
  } else {
    const audioBlob = new Blob([e.data], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(audioBlob);
    const audio = new Audio(url);
    audio.play().catch((err) => {
      // Autoplay blocked, system muted, or codec unsupported. Make it visible
      // and offer a one-tap play button so the user can hear the reply.
      reply.innerHTML += ' <a href="#" id="audio-play-fallback" style="color:#ffaa44;text-decoration:underline">[click to play audio]</a>';
      const link = document.getElementById('audio-play-fallback');
      if (link) link.onclick = (ev) => { ev.preventDefault(); audio.play(); link.remove(); };
      console.warn('audio.play() failed:', err);
    });
  }
};

// ── Mic capture (hold-to-talk) ──────────────────────────────────────────────
let recorder = null;
let chunks = [];
let recordedMime = '';
let startedAt = 0;
const micBtn = document.getElementById('mic-btn');

// Pick the best MediaRecorder MIME type the browser supports. Safari only
// supports audio/mp4; Chrome+Firefox prefer audio/webm. We let the browser
// tell us which it can produce instead of hard-coding webm.
function pickMimeType() {
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4',
    'audio/ogg;codecs=opus',
    '',  // empty → browser picks default
  ];
  for (const m of candidates) {
    if (m === '' || (window.MediaRecorder && MediaRecorder.isTypeSupported(m))) {
      return m;
    }
  }
  return '';
}

async function startRec() {
  // Cut NarAI off if it's still talking — that's the interrupt.
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'interrupt'}));
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    chunks = [];
    const mime = pickMimeType();
    recordedMime = mime || 'audio/webm';
    recorder = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = async () => {
      // Pad short presses so we always have at least 600ms of audio captured.
      const elapsed = Date.now() - startedAt;
      if (elapsed < 600) {
        await new Promise(r => setTimeout(r, 600 - elapsed));
      }
      // Force one last data flush before bundling.
      try { if (recorder.state !== 'inactive') recorder.requestData(); } catch (_) {}
      // Wait a tick so requestData's chunk lands in the array.
      await new Promise(r => setTimeout(r, 50));
      const blob = new Blob(chunks, {type: recordedMime});
      const buf = await blob.arrayBuffer();
      if (ws.readyState === WebSocket.OPEN) ws.send(buf);
      stream.getTracks().forEach(t => t.stop());
    };
    // start() with NO timeslice — the recorder buffers the whole recording
    // and emits one complete webm/mp4 file on stop(). Earlier we used
    // start(250) hoping per-chunk emission would help short presses, but
    // some Chrome versions only put the EBML header in the very first
    // 250ms chunk; if that chunk never fires (race with stop()), the
    // concat'd blob starts with a Cluster element and Whisper rejects.
    // With no timeslice + the 1s min-duration guard in stopRec(), every
    // recording finishes as a single self-contained file.
    recorder.start();
    startedAt = Date.now();
    setState('listening');
  } catch (err) {
    reply.textContent = 'Mic error: ' + err.message;
  }
}

async function stopRec() {
  if (!recorder || recorder.state !== 'recording') return;
  // Hold the recording open until MediaRecorder has emitted at least one
  // full timeslice. Without this, very short presses (<250ms) flush a
  // Cluster-only chunk with no EBML header, which Whisper rejects.
  const elapsed = Date.now() - startedAt;
  const MIN_RECORDING_MS = 1000;
  if (elapsed < MIN_RECORDING_MS) {
    await new Promise(r => setTimeout(r, MIN_RECORDING_MS - elapsed));
  }
  recorder.stop();
}

// Pointer events handle both mouse and touch in one path.
// We deliberately do NOT bind mouseleave — it's a UX trap that cancels the
// recording the moment the cursor drifts off the button.
micBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startRec(); });
micBtn.addEventListener('pointerup',   (e) => { e.preventDefault(); stopRec(); });
micBtn.addEventListener('pointercancel', stopRec);
</script>
</body>
</html>
