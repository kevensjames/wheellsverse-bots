# SUPREMA autorepair scan on PR
#
# Copy this file into `.github/workflows/suprema-scan.yml` in any
# SUPREMA-managed repository. The workflow scans on every PR and posts
# a comment summarizing findings. The PR check fails if any auto-safe
# pattern finding lands in changed files.
#
# Requires repository secret: SUPREMA_REF — the git ref of the SUPREMA
# workspace to use for scanner code (default: main).

name: SUPREMA autorepair scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so blame works
          path: project

      - name: Checkout SUPREMA workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUPREMA_REPO || 'kevensjames/suprema-workspace' }}
          ref: ${{ vars.SUPREMA_REF || 'main' }}
          path: suprema-workspace
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run scan
        id: scan
        working-directory: suprema-workspace
        env:
          # Map this repo to the SUPREMA project name. Configure via repo var.
          PROJECT_NAME: ${{ vars.SUPREMA_PROJECT_NAME || github.event.repository.name }}
        run: |
          # Symlink the project under SUPREMA_ROOT so scanners find it
          mkdir -p projects-mount
          ln -s ${{ github.workspace }}/project projects-mount/${PROJECT_NAME}
          PYTHONPATH=. python -m suprema.autorepair.cli \
              --project ${PROJECT_NAME} scan --json > scan-result.json 2>&1 || true

          # Count high-severity findings
          HIGH_COUNT=$(python -c "
          import json
          d = json.load(open('scan-result.json'))
          print(sum(1 for f in d if f.get('severity') == 'high'))
          ")
          AUTO_SAFE_COUNT=$(python -c "
          import json, sys
          sys.path.insert(0, '.')
          from suprema.autorepair.engine import CATALOG
          d = json.load(open('scan-result.json'))
          print(sum(1 for f in d if CATALOG.get(f.get('pattern'),{}).get('safety')=='auto-safe'))
          ")
          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "auto_safe_count=$AUTO_SAFE_COUNT" >> $GITHUB_OUTPUT
          echo "total_count=$(python -c 'import json; print(len(json.load(open(\"scan-result.json\"))))')" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('suprema-workspace/scan-result.json'));
            const high = data.filter(f => f.severity === 'high').slice(0, 10);
            const lines = [
              `## 🔧 SUPREMA autorepair scan`,
              ``,
              `**Total findings:** ${data.length}`,
              `**High severity:** ${{ steps.scan.outputs.high_count }}`,
              `**Auto-safe (would auto-fix):** ${{ steps.scan.outputs.auto_safe_count }}`,
              ``,
            ];
            if (high.length) {
              lines.push(`### High-severity findings`);
              for (const f of high) {
                lines.push(`- \`${f.pattern}\` at \`${f.location}\` — ${f.evidence.slice(0, 100)}`);
              }
            }
            lines.push(``);
            lines.push(`<sub>Auto-generated by [suprema-autorepair](https://github.com/kevensjames/suprema-workspace)</sub>`);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            });

      - name: Fail PR check if auto-safe findings on changed files
        run: |
          if [ "${{ steps.scan.outputs.auto_safe_count }}" -gt 0 ]; then
            echo "::error::SUPREMA found ${{ steps.scan.outputs.auto_safe_count }} auto-safe-pattern finding(s)."
            echo "::error::Run \`suprema-autorepair fix --commit\` locally to resolve."
            exit 1
          fi
