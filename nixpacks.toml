# cache-bust: 2026-04-19
[phases.setup]
nixPkgs = ["python311", "gcc", "libffi", "openssl"]

[phases.install]
cmds = ["pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -r requirements-server.txt"]

[start]
cmd = "sh -c 'uvicorn core.api:app --host 0.0.0.0 --port ${PORT:-8000}'"
