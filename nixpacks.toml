# cache-bust: 2026-04-24-playwright-explicit
[phases.setup]
nixPkgs = ["python311", "gcc", "libffi", "openssl", "rustc", "cargo"]

[phases.install]
cmds = [
  "pip install --no-cache-dir --upgrade pip",
  "pip install --no-cache-dir -r requirements-server.txt",
  "pip install --no-cache-dir 'playwright>=1.44.0'"
]

[start]
cmd = "sh -c 'uvicorn core.api:app --host 0.0.0.0 --port ${PORT:-8000}'"
