# netlify.toml — WheellsVerse landing page
[build]
  command   = ""                # static site — no build step
  publish   = "."               # index.html lives in the root of the deploy
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Root → landing page (no index.html)
[[redirects]]
  from   = "/"
  to     = "/landing_page.html"
  status = 200

# NEXORA platform — proxy all traffic to Railway backend
[[redirects]]
  from   = "/nexora/*"
  to     = "https://grateful-flexibility-production.up.railway.app/nexora/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "/nexora"
  to     = "https://grateful-flexibility-production.up.railway.app/nexora"
  status = 301
  force  = true

[[redirects]]
  from   = "/api/nx/*"
  to     = "https://grateful-flexibility-production.up.railway.app/api/nx/:splat"
  status = 200
  force  = true

# TikTok domain verification — serve files under nested paths
[[redirects]]
  from   = "/terms.html/tiktokCRZN1AfC1Gpbvo2O40Qt2N2GrLovawi8.txt"
  to     = "/tiktokCRZN1AfC1Gpbvo2O40Qt2N2GrLovawi8.txt"
  status = 200

[[redirects]]
  from   = "/privacy.html/tiktoknwcXTU3Nm4se6bEg1d3uBx1856QZojZp.txt"
  to     = "/tiktoknwcXTU3Nm4se6bEg1d3uBx1856QZojZp.txt"
  status = 200

[[redirects]]
  from   = "/terms.html/tiktokgrDzX7CUTNXdWJx4p7UpCvmgDv4IJPpd.txt"
  to     = "/tiktokgrDzX7CUTNXdWJx4p7UpCvmgDv4IJPpd.txt"
  status = 200

# Redirect bare HTTP to HTTPS
[[redirects]]
  from   = "http://wheellsverse-bots.pages.dev/*"
  to     = "https://wheellsverse-bots.pages.dev/:splat"
  status = 301
  force  = true

# Cache static assets aggressively
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
