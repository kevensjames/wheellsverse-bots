<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription cancelled — WheellsVerse</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #0a0a0f 0%, #1a1a2e 100%);
      color: #e8e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      backdrop-filter: blur(20px);
    }
    .icon { font-size: 48px; margin-bottom: 8px; opacity: 0.6; }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
    p { margin: 0 0 24px; color: #aaa; line-height: 1.6; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.92; }
    .btn-primary { background: #00d4ff; color: #000; }
    .btn-secondary {
      background: transparent;
      color: #aaa;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .small { color: #666; font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">↩️</div>
    <h1>No problem — checkout cancelled.</h1>
    <p>You weren't charged. Whenever you're ready, the door's still open.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/pricing">Back to pricing</a>
      <a class="btn btn-secondary" href="/">Home</a>
    </div>
    <p class="small">Questions? Email <a href="mailto:support@wheellsverse.com" style="color:#00d4ff">support@wheellsverse.com</a></p>
  </main>
</body>
</html>
