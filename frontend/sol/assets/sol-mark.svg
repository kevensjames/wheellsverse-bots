<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sol">
  <defs>
    <linearGradient id="solGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4A93C"/>
      <stop offset="1" stop-color="#C9781F"/>
    </linearGradient>
  </defs>
  <!-- rotation ring: dashed arc segments evoke the payout going around the circle -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="url(#solGrad)" stroke-width="3.2"
          stroke-linecap="round" stroke-dasharray="13 9.6" transform="rotate(-18 24 24)"/>
  <!-- sun center -->
  <circle cx="24" cy="24" r="8.5" fill="url(#solGrad)"/>
</svg>
