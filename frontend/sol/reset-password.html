<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The address holds a one-time reset token until the script below removes it: send no
     referrer, and keep the page out of search results. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Choose a new password — Sol</title>
<link rel="icon" href="/sol/assets/sol-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/sol/sol-design-system.css">
<link rel="stylesheet" href="/sol/auth-pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="auth-top">
  <nav aria-label="Site">
    <a href="/sol/" class="auth-brand"><img src="/sol/assets/sol-logo.svg" alt="Sol home"></a>
    <a href="/sol/?signin=1" class="btn btn-ghost btn--sm">Sign in</a>
  </nav>
</header>

<main id="main" tabindex="-1" class="auth-main">
  <div class="auth-card">
    <h1 id="pageTitle" tabindex="-1">Choose a new password</h1>

    <form id="resetForm" onsubmit="submitReset(event)" novalidate hidden>
      <p class="auth-lede">Enter a new password for your account.</p>
      <div class="field"><label for="resetPassword">New password</label>
        <input id="resetPassword" type="password" autocomplete="new-password" aria-describedby="resetHint" required></div>
      <p class="hint" id="resetHint">Use 8 to 128 characters.</p>
      <div class="field"><label for="resetConfirm">Type the new password again</label>
        <input id="resetConfirm" type="password" autocomplete="new-password" required></div>
      <p class="auth-err" id="resetErr" role="alert"></p>
      <button type="submit" class="btn btn--primary auth-wide" id="resetBtn">Save new password</button>
    </form>

    <section id="resetDone" hidden>
      <p>Your password is updated. Sign in with your new password.</p>
      <a class="btn btn--primary auth-wide" href="/sol/?signin=1">Sign in</a>
    </section>

    <section id="resetInvalid" hidden>
      <p id="resetInvalidText">This link has expired or was already used.</p>
      <p>Reset links work once and expire after an hour.</p>
      <a class="btn btn--primary auth-wide" href="/sol/?forgot=1">Request a new link</a>
    </section>

    <p class="sr-only" id="resetStatus" role="status" aria-live="polite"></p>
  </div>
</main>

<script src="/sol/app/core/account.js"></script>
<script>
// Reset password: POST /auth/reset-password {token, new_password} (backend api/auth.py:135-145).
// The token is read from the address once, removed from it at once, and kept in this
// variable only: never logged, stored or put back in the address.
const API = 'https://sol-api-production.up.railway.app';
let resetToken = SolAccount.readTokenOnce(window);
let resetBusy = false;

// focus: move focus to the heading (after an answer), so a screen reader reads the new state.
function resetShow(state, invalidText, focus) {
  document.getElementById('resetForm').hidden = state !== 'form';
  document.getElementById('resetDone').hidden = state !== 'done';
  document.getElementById('resetInvalid').hidden = state !== 'invalid';
  const h = document.getElementById('pageTitle');
  if (state === 'done') h.textContent = 'Password updated';
  else if (state === 'invalid') h.textContent = 'This link does not work';
  else h.textContent = 'Choose a new password';
  if (state === 'invalid' && invalidText) document.getElementById('resetInvalidText').textContent = invalidText;
  if (state !== 'form') resetToken = null;
  if (focus) h.focus();
}
function resetError(msg) {
  const el = document.getElementById('resetErr');
  el.textContent = msg || '';
}

async function submitReset(e) {
  e.preventDefault();
  if (resetBusy || !resetToken) return;
  const pw = document.getElementById('resetPassword'), confirm = document.getElementById('resetConfirm');
  const problem = SolAccount.passwordProblem(pw.value, confirm.value);
  resetError('');
  if (problem) { resetError(problem); (/match/.test(problem) ? confirm : pw).focus(); return; }
  resetBusy = true;
  const btn = document.getElementById('resetBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await SolAccount.callPublic(API, '/auth/reset-password', { method: 'POST', body: { token: resetToken, new_password: pw.value } });
    const out = SolAccount.resetOutcome(r.status);
    if (out === 'done') { pw.value = ''; confirm.value = ''; resetShow('done', null, true); }
    else if (out === 'invalid') { pw.value = ''; confirm.value = ''; resetShow('invalid', null, true); }
    else if (out === 'limited') resetError('Too many tries. Please wait a minute and try again.');
    else if (out === 'offline') resetError("We couldn't reach MySol. Check your connection and try again.");
    else resetError('Something went wrong. Please check your new password and try again.');
  } finally {
    resetBusy = false;
    btn.disabled = false; btn.textContent = 'Save new password';
  }
}

if (resetToken) resetShow('form');
else resetShow('invalid', 'This link is missing its code. Open the link from your email again, or request a new one.');
</script>
</body>
</html>
