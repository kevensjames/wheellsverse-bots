<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holding Operations</title>
<link rel="stylesheet" href="/admin/kai-presence.css">
<style>
  :root{--bg:#0b0f1a;--panel:#11172a;--border:#1e2740;--text:#e8edf5;--muted:#8a95a8;--cyan:#00d4ff;--purple:#a855f7;--accent:#4df4a5;--warn:#ffb547}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'Space Grotesk',system-ui,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  h1{font-size:19px;margin:0 0 4px} .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  .brand{font-weight:700;font-size:15px} .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:6px}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;border-radius:6px;padding:2px 7px}
  .v{color:var(--accent);border:1px solid rgba(77,244,165,.35)} .u{color:var(--warn);border:1px solid rgba(255,181,71,.35)} .k{color:var(--muted);border:1px solid var(--border)}
  .confirm{color:var(--warn);font-style:italic}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:18px}
  .panel h2{font-size:14px;margin:0 0 10px} .muted{color:var(--muted)} code{color:var(--cyan)}
  a{color:var(--cyan)} .msg{color:var(--warn);padding:14px}
  .sev{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;border-radius:5px;padding:2px 6px;margin-right:8px;white-space:nowrap}
  .sev.CRITICAL{color:#ff5c6c;border:1px solid rgba(255,92,108,.45);background:rgba(255,92,108,.08)}
  .sev.HIGH{color:var(--warn);border:1px solid rgba(255,181,71,.4)}
  .sev.MEDIUM{color:#ffe08a;border:1px solid rgba(255,224,138,.3)}
  .sev.LOW{color:var(--muted);border:1px solid var(--border)}
  .prio{display:flex;align-items:flex-start;gap:2px;padding:8px 0;border-top:1px solid var(--border)}
  .kpi{display:inline-block;margin:0 14px 4px 0;color:var(--muted)} .kpi b{color:var(--text)}
  .kpi.up b{color:#ff5c6c} .kpi.down b{color:var(--accent)}
  .prop{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px;background:rgba(255,255,255,.01)}
  .prophead{display:flex;align-items:flex-start;gap:9px} .prophead b{font-size:14px;font-weight:600}
  .pmeta{color:var(--muted);font-size:11.5px;margin:6px 0 0;text-transform:uppercase;letter-spacing:.4px}
  .plan{margin:9px 0 0;padding-left:20px;color:var(--muted);font-size:13px} .plan li{margin:3px 0}
  .acts{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
  .acts button{font:600 12px 'Space Grotesk',system-ui,sans-serif;border-radius:7px;padding:6px 13px;cursor:pointer;
    border:1px solid var(--accent);background:var(--accent);color:#04121a}
  .acts button.ghost{background:transparent;color:var(--text);border-color:var(--border)}
  .acts button:disabled{opacity:.5;cursor:default}
  .pres{font-size:12.5px;margin-left:4px} .pres.ok{color:var(--accent)} .pres.bad{color:var(--warn)}
  .statusgrid{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 6px}
  .skpi{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .skpi b{font-weight:700} .ok{color:var(--accent)} .bad{color:var(--warn)} .warn{color:var(--cyan)}
  .sh{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .wrow{font-size:12.5px;color:var(--muted);margin:4px 0}
  .wdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .wdot.on{background:var(--accent);box-shadow:0 0 0 3px rgba(77,244,165,.18)} .wdot.off{background:var(--warn)}
</style></head>
<body><div class="wrap">
  <h1>Holding Operations</h1>
  <div class="sub">Source-backed only · financials/customers/legal shown as <span class="confirm">requires operator confirmation</span> until you verify them · read-only</div>
  <div class="panel" id="cyberCard" style="margin-top:0">
    <h2>Cyber Operations <span class="badge k" id="cyState">…</span>
      <a href="/admin/security/cyber-operations" style="float:right;font-size:12px;font-weight:400">Open Command Center →</a></h2>
    <div class="statusgrid" id="cyGrid"><span class="skpi muted">Loading security overview…</span></div>
  </div>
  <div id="out"><div class="msg">Loading… (sign in via the KAI Command Center if this stays blank)</div></div>
</div>
<script>
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = c => c==='VERIFIED'?'<span class="badge v">verified</span>' : (c==='UNKNOWN'?'<span class="badge k">unknown</span>':'<span class="badge u">'+esc((c||'').toLowerCase())+'</span>');
async function j(p){ const r=await fetch(p,{credentials:'same-origin'}); if(!r.ok) throw new Error(r.status); return r.json(); }
function renderBriefing(b){
  const k=b.kpis||{}, mv=b.kpi_movement||{}, ps=b.todays_priorities;
  let h='<div class="panel"><h2>Morning briefing — '+esc(k.as_of||b.generated_at||'')+'</h2>';
  h+='<div class="muted" style="margin-bottom:10px">'+esc(b.timezone)+' · '+esc(b.delivery)+'</div>';
  h+='<div style="margin-bottom:8px">'
    +'<span class="kpi">entities <b>'+esc(k.entities_total)+'</b></span>'
    +'<span class="kpi">verified <b>'+esc(k.entities_verified)+'</b></span>'
    +'<span class="kpi">open risks <b>'+esc(k.open_risks)+'</b></span>'
    +'<span class="kpi">incidents <b>'+esc(k.open_incidents)+'</b></span>'
    +'<span class="kpi">awaiting confirmation <b>'+esc(k.fields_awaiting_confirmation)+'</b></span>'
    +'<span class="kpi">health <b>'+esc(k.health)+'</b></span></div>';
  if(mv && mv.status){ h+='<div class="muted" style="margin-bottom:10px">movement: '+esc(mv.status)+'</div>'; }
  else if(mv){
    const d=(f,label,goodDown)=>{ const v=mv[f]; if(v==null) return ''; const cls=v===0?'':((goodDown? v<0:v>0)?'down':'up'); return '<span class="kpi '+cls+'">'+label+' <b>'+(v>0?'+':'')+esc(v)+'</b></span>'; };
    h+='<div style="margin-bottom:10px"><span class="muted">movement since '+esc(mv.since)+':</span> '
      +d('entities_verified','verified',false)+d('open_risks','risks',true)+d('open_incidents','incidents',true)+d('fields_awaiting_confirmation','pending',true)+'</div>';
  }
  if(Array.isArray(ps)){
    h+='<h2 style="margin-top:6px">Today’s priorities <span class="muted" style="font-weight:400">('+ps.length+', ranked)</span></h2>';
    for(const p of ps){
      h+='<div class="prio"><span class="sev '+esc(p.severity)+'">'+esc(p.severity)+'</span>'
        +'<div><div>'+esc(p.title)+'</div><div class="muted" style="font-size:11.5px">source: <code>'+esc(p.source)+'</code>'
        +(p.detail?(' · '+esc(Array.isArray(p.detail)?p.detail.join(', '):p.detail)):'')+'</div></div></div>';
    }
  } else { h+='<div class="muted">'+esc(ps)+'</div>'; }
  return h+'</div>';
}
function renderProposals(d){
  const open=d.open||[];
  let h='<div class="panel"><h2>KAI proposals <span class="muted" style="font-weight:400">('+open.length+' open · KAI proposes, you decide)</span></h2>';
  h+='<div class="muted" style="font-size:12.5px;margin-bottom:12px">'+esc(d.note||'')+'</div>';
  if(!open.length){ return h+'<div class="muted">No open proposals — nothing needs a decision right now.</div></div>'; }
  for(const p of open){
    const a=p.action||{};
    h+='<div class="prop"><div class="prophead"><span class="sev '+esc(p.severity)+'">'+esc(p.severity)+'</span>'
      +'<b>'+esc(a.proposed_action||p.title)+'</b></div>'
      +'<div class="pmeta">'+esc(a.action_class||'')+' · impact '+esc(a.impact||'—')+' · '+esc(a.effort||'—')
      +(a.worker?(' · via <code>'+esc(a.worker)+'</code> worker'):'')+' · reversible</div>'
      +'<ol class="plan">'+((a.plan)||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'
      +'<div class="acts"><button data-act="approve" data-id="'+p.id+'">Approve</button>'
      +'<button class="ghost" data-act="reject" data-id="'+p.id+'">Reject</button>'
      +'<button class="ghost" data-act="execute" data-id="'+p.id+'">Execute</button>'
      +'<span class="pres" id="pr-'+p.id+'"></span></div></div>';
  }
  return h+'</div>';
}
function renderStatus(s){
  const a=s.autonomy||{}, checks=a.checks||{}, ov=a.overall||'—';
  const ovcls=ov==='AUTONOMOUS_READ_ONLY'?'v':'u';
  let h='<div class="panel"><h2>KAI autonomy <span class="badge '+ovcls+'">'+esc(ov)+'</span></h2>';
  h+='<div class="statusgrid">';
  for(const k of Object.keys(checks)){ const v=checks[k];
    const cls=(v==='PASS'||v==='MOCK'||v==='CONNECTED')?'ok':((v==='DEGRADED'||v==='UNAVAILABLE')?'bad':'warn');
    h+='<span class="skpi">'+esc(k.replace(/_/g,' '))+' <b class="'+cls+'">'+esc(v)+'</b></span>'; }
  h+='</div>';
  h+='<h3 class="sh">Workers</h3>';
  const ws=s.workers||[];
  if(!ws.length){ h+='<div class="muted">No worker has checked in — the persistent runner is not running.</div>'; }
  for(const w of ws){ h+='<div class="wrow"><span class="wdot '+(w.online?'on':'off')+'"></span><code>'+esc(w.worker_id)+'</code> · '
    +(w.online?'ONLINE':'OFFLINE')+' · heartbeat '+esc(w.last_heartbeat_secs_ago)+'s ago · v'+esc(w.version||'?')
    +(w.current_job?(' · job #'+esc(w.current_job)):'')+'</div>'; }
  const cw=s.cron.watch, cb=s.cron.briefing;
  h+='<h3 class="sh">Schedules &amp; delivery</h3><div class="muted" style="font-size:12.5px;line-height:1.7">'
    +'watch <code>'+esc(cw.schedule)+'</code> · last run '+esc(cw.last_run)+'<br>'
    +'briefing <code>'+esc(cb.schedule)+'</code> ('+esc(cb.timezone)+') · last run '+esc(cb.last_run)+'<br>'
    +'telegram <b class="'+(s.telegram.state==='CONNECTED'?'ok':'bad')+'">'+esc(s.telegram.state)+'</b> (token '+(s.telegram.token_present?'present':'absent')+')</div>';
  return h+'</div>';
}
// KAI Autonomy view (Part C) — rendered FIRST from /admin/kai/holding/view. TODAY FOR YOU leads.
function renderView(v){
  const st = s => '<span class="sev '+(({A2_READY_FOR_REVIEW:'HIGH',BLOCKED_CAPABILITY:'MEDIUM',BLOCKED_WORKER:'MEDIUM',
    OWNER_QUEUED:'HIGH',ACTIVE:'LOW',EXECUTED:'LOW'})[s]||'LOW')+'">'+esc(String(s||'').replace(/_/g,' '))+'</span>';
  let h='<div class="panel"><h2>TODAY FOR YOU</h2>';   // §25 first operational section
  const t=v.today_for_you;
  if(Array.isArray(t)){
    if(!t.length) h+='<div class="muted">No action required right now.</div>';
    for(const a of t){ h+='<div class="prio"><span class="sev '+esc(a.severity||'MEDIUM')+'">'+esc(a.severity||'')+'</span>'
      +'<div><div><b>'+esc(a.title)+'</b> · '+esc(a.company)+'</div>'
      +'<div class="muted" style="font-size:11.5px">'+esc(a.why||'')+' · KAI already did: '+esc(a.kai_completed||'—')
      +'<br>action: '+esc(a.action||'')+'</div></div></div>'; }
  } else { h+='<div class="muted">'+esc(t)+'</div>'; }
  if(v.today_overflow) h+='<div class="muted" style="margin-top:8px">'+esc(v.today_overflow)+'</div>';
  h+='</div>';
  // §26 KAI work buckets
  const w=v.kai_working||{};
  h+='<div class="panel"><h2>KAI Working</h2>';
  const bucket=(label,arr)=>{ let b='<h3 class="sh">'+label+' ('+(arr||[]).length+')</h3>';
    if(!(arr||[]).length) return b+'<div class="muted" style="font-size:12px">none</div>';
    for(const it of arr){ b+='<div class="wrow">'+st(it.status)+' <code>'+esc(it.company)+'</code> · '+esc(it.task||'')
      +(it.capability?(' · '+esc(it.capability)):'')+(it.reason?(' · '+esc(it.reason)):'')+'</div>'; } return b; };
  h+=bucket('Working now',w.currently_working)+bucket('Ready for review',w.ready_for_review)
    +bucket('Blocked',w.blocked)+bucket('Owner queued',w.owner_queued)+'</div>';
  // §28 company cards — DYNAMIC (loop over discovered companies; no hard-coded names)
  h+='<div class="panel"><h2>Companies</h2><div class="grid">';
  for(const c of (v.company_cards||[])){ h+='<div class="card"><div class="brand">'+esc(c.name||c.company_id)+'</div>'
    +'<div class="row"><span>status</span><span>'+esc(c.status)+'</span></div>'
    +'<div class="row"><span>goal</span><span>'+esc(c.current_goal||'—')+'</span></div>'
    +'<div class="row"><span>plan freshness</span><span>'+esc(c.plan_freshness||'—')+'</span></div>'
    +'<div class="row"><span>owner blocker</span><span>'+(c.owner_blocker?'<b class="bad">yes</b>':'no')+'</span></div></div>'; }
  h+='</div></div>';
  // §27 self-improvement READY_FOR_REVIEW
  const sis=v.self_improvement_ready||[];
  h+='<div class="panel"><h2>Self-Improvement — ready for review ('+sis.length+')</h2>';
  if(!sis.length) h+='<div class="muted">Nothing prepared for review.</div>';
  for(const s of sis){ h+='<div class="prop"><b>'+esc(s.problem)+'</b>'
    +'<div class="pmeta">tests before '+esc(s.tests_before)+' · after '+esc(s.tests_after)+' · review: '+esc(s.independent_review)+'</div>'
    +'<div class="muted" style="font-size:12px;margin-top:6px">files: '+esc((s.files_changed||[]).join(', '))
    +'<br>rollback: '+esc(s.rollback)+'</div><div class="acts" style="margin-top:8px">'+esc(s.owner_action)+'</div></div>'; }
  h+='</div>';
  // KAI IMPROVEMENT WATCH (DETECT_ONLY) — detection only; each row shows the action, never "fixing"
  const iw=v.improvement_watch||{}; const iwc=iw.candidates||[];
  h+='<div class="panel"><h2>KAI Improvement Watch <span class="muted" style="font-weight:400">('+esc(iw.mode||'OFF')+')</span></h2>';
  h+='<div class="muted" style="font-size:12.5px;margin-bottom:6px">action: <b>'+esc(iw.action||'—')+'</b>'+(iw.last_run?(' · last run '+esc(iw.last_run)):'')+'</div>';
  if(!iwc.length) h+='<div class="muted">No candidates detected.</div>';
  for(const c of iwc){ const fix=c.source==='CERTIFICATION_FIXTURE';
    h+='<div class="prop"><b>'+esc(c.problem||c.signature)+'</b> <span class="badge '+(fix?'':'ok')+'">'+(fix?'CERTIFICATION_FIXTURE':'NATURAL')+'</span>'
    +'<div class="pmeta">'+esc(c.signal_type||'')+(c.confirmed?' · CONFIRMED':'')+' · '+esc(c.severity||'')+'</div>'
    +'<div class="acts" style="margin-top:6px">'+esc(iw.action||'PREPARATION NOT AUTHORIZED')+'</div></div>'; }
  h+='</div>';
  // DEPLOYMENT TRUTH — running SHA + drift + feature registry (deployed vs ENABLED)
  const dp=v.deployment||{}; const dr=dp.drift||{}; const feats=dp.features||[];
  h+='<div class="panel"><h2>Deployment &amp; Drift <span class="badge '+((dp.environment==='production')?'':'ok')+'">'+esc((dp.environment||'?').toUpperCase())+'</span></h2>';
  h+='<div class="statusgrid">'
    +'<span class="skpi">running SHA <b>'+esc(dp.this_app_sha||'?')+'</b></span>'
    +'<span class="skpi">drift <b>'+esc(dr.state||'UNKNOWN')+'</b></span>'
    +'<span class="skpi">money mode <b>'+esc(dp.money_mode||'MOCK')+'</b></span>'
    +'<span class="skpi">source <b>'+esc((dp.shas||{}).source_head||'UNKNOWN')+'</b></span></div>';
  h+='<h3 class="sh" style="margin-top:10px">Feature Registry <span class="muted" style="font-weight:400">(deployed ≠ enabled)</span></h3>';
  h+='<div class="muted" style="font-size:12.5px;line-height:1.8">';
  for(const f of feats){ const en=f.runtime_enabled; const rc=f.risk_class||'';
    h+='<div><b>'+esc(f.name)+'</b> <span class="badge">'+esc(rc)+'</span> '
      +'<span class="badge ok">DEPLOYED</span> '
      +'<span class="badge '+(en?'ok':'bad')+'">'+(en?'ENABLED':'DISABLED')+'</span> '
      +'<span class="muted">'+esc(f.certification||'')+'</span></div>'; }
  h+='</div></div>';
  // §62 Operational Self Model — FULL field set; operational only, no consciousness claim
  const m=v.operational_self_model||{};
  h+='<div class="panel"><h2>Operational Self Model</h2><div class="statusgrid">'
    +'<span class="skpi">identity <b>'+esc(m.identity)+'</b></span>'
    +'<span class="skpi">role <b>'+esc(m.role||'—')+'</b></span>'
    +'<span class="skpi">version <b>'+esc(m.software_version)+'</b></span>'
    +'<span class="skpi">production SHA <b>'+esc(m.production_sha||'UNAVAILABLE')+'</b></span>'
    +'<span class="skpi">staging SHA <b>'+esc(m.staging_sha||'UNAVAILABLE')+'</b></span>'
    +'<span class="skpi">environment <b>'+esc(m.environment)+'</b></span>'
    +'<span class="skpi">runtime <b>'+esc(m.runtime||'UNAVAILABLE')+'</b></span>'
    +'<span class="skpi">model / provider <b>'+esc(m.model||'UNAVAILABLE')+' / '+esc(m.model_provider||'UNAVAILABLE')+'</b></span>'
    +'<span class="skpi">autonomy posture <b>'+esc(m.autonomy_posture||'UNAVAILABLE')+'</b></span>'
    +'<span class="skpi">autonomy class <b>'+esc(m.autonomy_class||'—')+'</b></span>'
    +'<span class="skpi">capabilities ready <b>'+esc(m.capabilities_ready)+' / '+esc(m.capability_catalog_total||'?')+'</b></span>'
    +'<span class="skpi">workers <b>'+esc(m.workers_online)+' online / '+esc(m.workers_known||0)+'</b></span>'
    +'<span class="skpi">current mission <b>'+esc(m.current_mission||'—')+'</b></span>'
    +'<span class="skpi">owner actions <b>'+esc(m.owner_required_count)+'</b></span>'
    +'<span class="skpi">last cycle <b>'+esc(m.last_holding_cycle||'—')+'</b></span>'
    +'<span class="skpi">last verified <b>'+esc(m.last_verified||'UNAVAILABLE')+'</b></span></div>';
  h+='<div class="muted" style="font-size:12.5px;margin-top:8px"><b>Current attention:</b> '+esc(m.current_attention||'—')+'</div>';
  const lims=m.limitations||[];
  if(lims.length){ h+='<h3 class="sh" style="margin-top:10px">Limitations <span class="muted" style="font-weight:400">(live-derived from policy &amp; flags)</span></h3><ul class="muted" style="font-size:12.5px;line-height:1.7;margin:4px 0 0 18px">';
    for(const l of lims){ h+='<li>'+esc(l)+'</li>'; } h+='</ul>'; }
  h+='<div class="muted" style="font-size:11.5px;margin-top:6px">Operational self-awareness only — KAI makes no claim to consciousness or sentience.</div></div>';
  // §30 autonomy (backend-authoritative)
  const au=v.autonomy||{};
  h+='<div class="panel"><h2>Autonomy</h2><div class="statusgrid">'
    +'<span class="skpi">global <b>'+esc(au.global)+'</b></span>'
    +'<span class="skpi">money mode <b>'+esc(au.money_mode)+'</b></span>'
    +'<span class="skpi">A0/A1 <b>'+esc(au.a0_a1)+'</b></span>'
    +'<span class="skpi">A2 grants <b>'+esc((au.a2_certified_grants||[]).join(', ')||'none')+'</b></span>'
    +'<span class="skpi">last cycle <b>'+esc(au.last_cycle_verdict||au.last_cycle||'—')+'</b></span></div></div>';
  return h;
}
async function onProposalAction(e){
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const id=b.dataset.id, act=b.dataset.act, r=document.getElementById('pr-'+id);
  b.disabled=true; r.className='pres muted'; r.textContent='…';
  try{
    const path='/admin/kai/holding/proposals/'+id+'/'+act+(act==='reject'?'?reason=via%20UI':'');
    const resp=await fetch(path,{method:'POST',credentials:'same-origin'});
    const jd=await resp.json().catch(()=>({}));
    if(!resp.ok){ r.className='pres bad'; r.textContent='✕ '+(jd.detail||resp.status); }
    else if(act==='execute'){ const k=(jd.evidence&&jd.evidence.kind)||'executed'; r.className='pres ok'; r.textContent='✓ '+(k==='DISPATCHED'?('dispatched → worker job #'+jd.evidence.job_id):k); }
    else { r.className='pres ok'; r.textContent='✓ '+act+(act==='approve'?'d — now Execute':'ed'); }
  }catch(err){ r.className='pres bad'; r.textContent='✕ '+err; }
  b.disabled=false;
}
(async ()=>{
  const out=document.getElementById('out');
  try{
    const who = await j('/admin/session/whoami');
    if(!who.authenticated || who.role!=='owner'){ out.innerHTML='<div class="msg">Owner sign-in required. Open the KAI Command Center, sign in, then reload.</div>'; return; }
    const ov = await j('/admin/kai/holding/overview');          // through the bridge → App B (owner-gated)
    let html='';
    try{ html+=renderView(await j('/admin/kai/holding/view')); }catch(_){}       // TODAY FOR YOU leads (§25)
    try{ html+=renderStatus(await j('/admin/kai/holding/status')); }catch(_){}   // operational status next
    html+='<div class="grid">';
    for(const e of ov.entities){
      html+='<div class="card"><div class="brand">'+esc(e.brand)+' '+badge(e.confidence)+'</div>'
        +'<div class="row"><span>status</span><span>'+esc(e.status)+'</span></div>'
        +'<div class="row"><span>stage</span><span>'+esc(e.stage||'—')+'</span></div>'
        +'<div class="row"><span>repo</span><span>'+esc(e.repository||'—')+'</span></div>'
        +'<div class="row"><span>deploy</span><span>'+esc(e.deployment||'—')+'</span></div></div>';
    }
    html+='</div>';
    html+='<div class="panel"><h2>Financials & sensitive data</h2><div class="muted">'+esc(ov.financials)+'</div>'
      +'<div class="muted" style="margin-top:8px">Fields awaiting confirmation: <code>'+esc(ov.requires_confirmation.length)+'</code></div></div>';
    try{ html+=renderBriefing(await j('/admin/kai/holding/briefing')); }catch(_){}
    try{ html+=renderProposals(await j('/admin/kai/holding/proposals')); }catch(_){}
    out.innerHTML=html;
    out.addEventListener('click', onProposalAction);   // approve / reject / execute
  }catch(err){ out.innerHTML='<div class="msg">Holding view unavailable ('+esc(err.message)+'). It is enabled only when KAI_HOLDING_ENABLED is on.</div>'; }
})();
</script>
<script>
/* Cyber Operations §36 card — every field from /admin/kai/cyber/overview or an honest
   marker; zero fabricated finding/incident/metric. Independent of the main loader above. */
(function(){
  const E = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const B = st => { const ok=(st==='WORKING'||st==='LIVE');
    // NOT_CONNECTED / UNKNOWN / UNAVAILABLE / PHASE_C_PENDING are neutral gray (matching the
    // standalone page); amber ('u') is reserved for a genuinely DEGRADED state (D5).
    const neutral=(st==='PHASE_C_PENDING'||st==='NOT_CONNECTED'||st==='NOT CONNECTED'||st==='UNKNOWN'||st==='UNAVAILABLE');
    const cls = ok?'v':(neutral?'k':'u'); return '<span class="badge '+cls+'">'+E(st||'—')+'</span>'; };
  const kpi = (label,html) => '<span class="skpi">'+E(label)+' <b>'+html+'</b></span>';
  (async()=>{
    const grid=document.getElementById('cyGrid'), state=document.getElementById('cyState');
    let o;
    try{
      const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),8000);
      const r=await fetch('/admin/kai/cyber/overview',{credentials:'include',signal:ctrl.signal}); clearTimeout(t);
      if(!r.ok){ state.className='badge k'; state.textContent='NOT CONNECTED';
        grid.innerHTML='<span class="skpi muted">Security overview not connected (HTTP '+r.status+
          (r.status===401||r.status===403?' — owner sign-in required':r.status===404?' — feature off / no backend':'')+
          '). No value fabricated.</span>'; return; }
      o=await r.json();
    }catch(err){ state.className='badge k'; state.textContent='OFFLINE';
      grid.innerHTML='<span class="skpi muted">Security core unreachable ('+E(err&&err.message||err)+').</span>'; return; }
    const risk=o.risk||{}, aik=o.aikido||{}, inc=o.incidents||{}, ev=o.events||{};
    const degraded=(o.state&&o.state!=='WORKING')||risk.band==='HIGH'||risk.band==='CRITICAL';
    state.className='badge '+(degraded?'u':'v'); state.textContent=degraded?'DEGRADED':'LIVE';
    const un=risk.unmeasured_sources||[];
    // Critical findings / auth anomalies are Aikido/monitor-sourced — NOT_CONNECTED in this phase.
    const crit = (aik.state==='WORKING') ? '<b>see Aikido</b>' : B(aik.state||'NOT_CONNECTED');
    const auth = un.indexOf('auth_anomalies')>=0 ? B('NOT_CONNECTED') : (o.auth_anomalies!=null?('<b>'+E(o.auth_anomalies)+'</b>'):B('UNKNOWN'));
    // Only emit a count when we actually have the incidents array; otherwise show just
    // the state badge with NO leading number (mirrors the standalone page) (§49 H1).
    const incCount = Array.isArray(inc.incidents)?(inc.incidents.length+' '):'';
    grid.innerHTML =
      kpi('security state', (typeof risk.score==='number'?('risk '+E(risk.score)+' / '+E(risk.band||'—')):E(o.state||'—')))
      + kpi('active incidents', incCount+B(inc.state||'PHASE_C_PENDING'))
      + kpi('critical findings', crit)
      + kpi('auth anomalies', auth)
      + kpi('aikido', B(aik.state||'NOT_CONNECTED'))
      + kpi('last security event', (ev.last_event&&ev.last_event.timestamp?E(ev.last_event.timestamp):'—'));
  })();
})();
</script>
