<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — NarAI by WheellsVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#05070d;--surface:#0d1117;--border:#1a2035;
    --cyan:#00d4ff;--purple:#a855f7;--green:#00ff88;
    --text:#e2e8f0;--muted:#64748b;
  }
  body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}

  /* Stars background */
  body::before{
    content:'';position:fixed;top:0;left:0;width:100%;height:100%;
    background:radial-gradient(ellipse at 20% 50%,rgba(168,85,247,0.07) 0%,transparent 60%),
              radial-gradient(ellipse at 80% 20%,rgba(0,212,255,0.07) 0%,transparent 60%);
    pointer-events:none;z-index:0
  }

  .logo{position:fixed;top:28px;left:32px;text-decoration:none;display:flex;align-items:center;gap:10px;z-index:10}
  .logo-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--cyan),var(--purple));
    border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#000}
  .logo-text{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent}

  .card{
    position:relative;z-index:1;width:100%;max-width:420px;padding:48px 40px;
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    box-shadow:0 0 60px rgba(0,212,255,0.05)
  }

  h1{font-size:28px;font-weight:700;margin-bottom:6px}
  .subtitle{color:var(--muted);font-size:15px;margin-bottom:32px}

  .google-btn{
    width:100%;padding:13px;background:transparent;border:1px solid var(--border);
    border-radius:12px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:15px;
    font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
    transition:all 0.2s;margin-bottom:24px
  }
  .google-btn:hover{border-color:var(--cyan);background:rgba(0,212,255,0.05)}
  .google-btn img{width:20px;height:20px}

  .divider{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .divider span{color:var(--muted);font-size:13px}

  .field{margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
  input{
    width:100%;padding:13px 16px;background:rgba(255,255,255,0.03);
    border:1px solid var(--border);border-radius:12px;color:var(--text);
    font-family:'Space Grotesk',sans-serif;font-size:15px;outline:none;transition:all 0.2s
  }
  input:focus{border-color:var(--cyan);background:rgba(0,212,255,0.03)}
  input::placeholder{color:var(--muted)}

  .forgot{display:block;text-align:right;font-size:13px;color:var(--cyan);
    text-decoration:none;margin-top:-10px;margin-bottom:24px}
  .forgot:hover{text-decoration:underline}

  .btn-primary{
    width:100%;padding:14px;background:linear-gradient(135deg,var(--cyan),var(--purple));
    border:none;border-radius:12px;color:#000;font-family:'Space Grotesk',sans-serif;
    font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s;
    display:flex;align-items:center;justify-content:center;gap:8px
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(0,212,255,0.3)}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}

  .signup-link{text-align:center;margin-top:24px;font-size:14px;color:var(--muted)}
  .signup-link a{color:var(--cyan);text-decoration:none;font-weight:600}
  .signup-link a:hover{text-decoration:underline}

  .error-msg{
    background:rgba(255,59,59,0.1);border:1px solid rgba(255,59,59,0.3);
    border-radius:10px;padding:12px 16px;font-size:14px;color:#ff6b6b;
    margin-bottom:18px;display:none
  }

  .spinner{
    width:18px;height:18px;border:2px solid rgba(0,0,0,0.3);
    border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;display:none
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<a href="/" class="logo">
  <div class="logo-mark">N</div>
  <span class="logo-text">NarAI</span>
</a>

<div class="card">
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to continue with NarAI</p>

  <button class="google-btn" onclick="signInGoogle()">
    <img src="https://www.google.com/favicon.ico" alt="Google">
    Continue with Google
  </button>

  <div class="divider"><span>or sign in with email</span></div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')signIn()">
  </div>

  <a href="/forgot-password" class="forgot">Forgot password?</a>

  <button class="btn-primary" onclick="signIn()" id="signInBtn">
    <div class="spinner" id="spinner"></div>
    <span id="btnText">Sign In</span>
  </button>

  <p class="signup-link">Don't have an account? <a href="/signup">Create one free</a></p>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL  = '%%SUPABASE_URL%%';
  const SUPABASE_ANON = '%%SUPABASE_ANON_KEY%%';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  function showError(msg){
    const el=document.getElementById('errorMsg');
    el.textContent=msg;el.style.display='block'
  }
  function hideError(){document.getElementById('errorMsg').style.display='none'}
  function setLoading(on){
    document.getElementById('spinner').style.display=on?'block':'none';
    document.getElementById('btnText').textContent=on?'Signing in...':'Sign In';
    document.getElementById('signInBtn').disabled=on
  }

  async function signIn(){
    hideError();setLoading(true);
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    if(!email||!password){showError('Please enter your email and password');setLoading(false);return}
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){showError(error.message);setLoading(false);return}
    window.location.href='/chat'
  }

  async function signInGoogle(){
    const {error}=await sb.auth.signInWithOAuth({
      provider:'google',
      options:{redirectTo: window.location.origin+'/chat'}
    });
    if(error)showError(error.message)
  }

  // If already logged in, redirect
  sb.auth.getSession().then(({data:{session}})=>{
    if(session)window.location.href='/chat'
  })
</script>
</body>
</html>
